apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: ml-training
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: model-training
    spec:
      restartPolicy: Never

      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          volumeMounts:
            - name: training-config
              mountPath: /app/configs
              readOnly: true

            - name: ml-storage
              mountPath: /app/data
              subPath: data

            - name: ml-storage
              mountPath: /app/checkpoints
              subPath: checkpoints

      volumes:
        - name: training-config
          configMap:
            name: training-config

        - name: ml-storage
          persistentVolumeClaim:
            claimName: ml-data-checkpoints